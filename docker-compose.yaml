services:

  laravel:
    build:
      context: .                          
      dockerfile: ./Dockerfile   
    container_name: veruvel_laravel
    restart: unless-stopped               
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html                                    
    networks:
      - veruvel_network
  
  nginx:
    image: nginx:alpine
    container_name: veruvel_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - veruvel_network
    depends_on:
      - laravel

networks:
  veruvel_network:
    driver: bridge